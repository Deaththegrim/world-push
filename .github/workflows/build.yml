name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libdbus-1-3 libgl1
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm packaging/world_push.spec
      - name: Smoke test the build
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen WORLD_PUSH_SMOKE=1 ./dist/WorldPush*
      - uses: actions/upload-artifact@v4
        with:
          name: WorldPush-${{ runner.os }}
          path: dist/WorldPush*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: |
          mv out/WorldPush-Linux/WorldPush WorldPush-linux
          mv out/WorldPush-Windows/WorldPush.exe WorldPush-windows.exe
          gh release create "$GITHUB_REF_NAME" WorldPush-linux WorldPush-windows.exe --repo "$GITHUB_REPOSITORY" --prerelease --title "World Push $GITHUB_REF_NAME" --notes "Test build: both size limits shown, problems explained in plain words, a help tab. Windows hasn't been run by a person yet."
        env:
          GH_TOKEN: ${{ github.token }}
